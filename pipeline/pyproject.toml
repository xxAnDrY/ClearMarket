[project]
name = "clearmarkets-pipeline"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "feedparser>=6.0.11,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clearmarkets"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
