# Il sito sta in web/: dalla radice del repository Netlify non troverebbe nulla da compilare.
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Netlify ospita solo il sito: API, worker e database restano su un server.
# Quando il backend e' online, togli il commento e metti il suo dominio.
# [[redirects]]
#   from = "/api/*"
#   to = "https://IL-TUO-BACKEND/api/:splat"
#   status = 200
#   force = true
