# Il sito sta in web/: dalla radice del repository Netlify non troverebbe nulla da compilare.
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Notizie e barra mercati: file aggiornati dal job di GitHub Actions sul ramo `data`.
# Grafici e market mover: Netlify Functions in web/netlify/functions.
# Funziona solo con repository pubblico.
[[redirects]]
  from = "/live/*"
  to = "https://raw.githubusercontent.com/xxAnDrY/ClearMarket/data/public/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
