# Stack locale. Sito su http://localhost:8080
# Le migrazioni vengono applicate da Postgres al primo avvio del volume.
services:
  web:
    build: ./web
    environment:
      SITE_ADDRESS: ":80"
    ports: ["8080:80"]
    depends_on: [api]

  api:
    build: ./backend
    env_file: ./backend/.env
    environment: &backend-env
      DATABASE_URL: postgresql://clearmarket:clearmarket@postgres:5432/clearmarket
      REDIS_URL: redis://redis:6379/0
      TRUSTED_PROXY_HOPS: "1"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build: ./backend
    command: ["python", "-m", "app.ingestion.worker"]
    env_file: ./backend/.env
    environment: *backend-env
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: clearmarket
      POSTGRES_PASSWORD: clearmarket
      POSTGRES_DB: clearmarket
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearmarket"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]

volumes:
  pgdata:
