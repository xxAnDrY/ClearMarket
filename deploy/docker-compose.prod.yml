# Stack di produzione per un singolo server. Avvio: deploy/install.sh
# Solo Caddy e' esposto; Postgres e Redis restano sulla rete interna di Docker.
name: clearmarket

x-backend: &backend
  build: ../backend
  restart: always
  env_file: .env
  environment: &backend-env
    DATABASE_URL: postgresql://clearmarket:${POSTGRES_PASSWORD}@postgres:5432/clearmarket
    REDIS_URL: redis://redis:6379/0
    # Una sola istanza di Caddy davanti all'API: l'IP del client e' l'ultimo della catena.
    TRUSTED_PROXY_HOPS: "1"
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_started }

services:
  caddy:
    image: caddy:2-alpine
    restart: always
    environment:
      DOMAIN: ${DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]

  api:
    <<: *backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *backend
    command: ["python", "-m", "app.ingestion.worker"]

  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: clearmarket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: clearmarket
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearmarket"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
