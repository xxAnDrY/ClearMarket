[project]
name = "clearmarket-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "asyncpg>=0.30,<1",
    "redis>=5.2,<7",
    "httpx>=0.27,<1",
    "feedparser>=6.0.11,<7",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "PyJWT[crypto]>=2.9,<3",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "fakeredis[lua]>=2.26",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
